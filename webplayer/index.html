<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #010409; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .wrap { background: #0d1117; border-radius: 12px; padding: 24px; font-family: ui-monospace, Menlo, Consolas, monospace; color: #c9d1d9; width: 100%; max-width: 640px; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #21262d; padding-bottom: 16px; }
  .badge { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 4px 10px; font-size: 11px; color: #8b949e; letter-spacing: 0.08em; }
  .title { font-size: 13px; font-weight: 500; color: #e6edf3; letter-spacing: 0.1em; flex: 1; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 6px #3fb950; flex-shrink: 0; }
  .status-dot.off { background: #f85149; box-shadow: 0 0 6px #f85149; }
  .status-dot.connecting { background: #d29922; box-shadow: 0 0 6px #d29922; }
  .status-dot.idle { background: #58a6ff; box-shadow: 0 0 6px #58a6ff; }
  .viz-area { background: #010409; border-radius: 8px; border: 1px solid #21262d; height: 120px; margin-bottom: 16px; position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .no-signal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #484f58; letter-spacing: 0.15em; }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .play-btn { width: 44px; height: 44px; border-radius: 50%; background: #238636; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  .play-btn:hover { background: #2ea043; }
  .play-btn.playing { background: #b62324; }
  .play-btn.playing:hover { background: #da3633; }
  .play-btn svg { width: 18px; height: 18px; fill: #fff; }
  .vol-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
  .vol-icon { color: #8b949e; font-size: 14px; flex-shrink: 0; }
  input[type=range] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: #21262d; border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #58a6ff; cursor: pointer; }
  .vol-val { font-size: 11px; color: #8b949e; min-width: 28px; text-align: right; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat { background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 10px 12px; }
  .stat-label { font-size: 10px; color: #484f58; letter-spacing: 0.1em; margin-bottom: 4px; }
  .stat-val { font-size: 14px; color: #e6edf3; font-weight: 500; }
  .stat-val.green { color: #3fb950; }
  .stat-val.amber { color: #d29922; }
  .stat-val.red { color: #f85149; }
  .stat-val.dim { color: #484f58; }
  .status-bar { display: flex; align-items: center; gap: 12px; font-size: 10px; color: #484f58; letter-spacing: 0.08em; border-top: 1px solid #21262d; padding-top: 12px; }
  .stream-url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  audio { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="status-dot off" id="dot"></div>
    <span class="title">RADIO MONITOR</span>
    <span class="badge" id="status-badge">OFFLINE</span>
    <span class="badge" id="bitrate-badge">--- kbps</span>
  </div>

  <div class="viz-area">
    <canvas id="viz"></canvas>
    <div class="no-signal" id="no-signal">NO SIGNAL</div>
  </div>

  <div class="controls">
    <button class="play-btn" id="play-btn" onclick="togglePlay()" aria-label="Play or stop">
      <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <div class="vol-wrap">
      <span class="vol-icon">&#9650;</span>
      <input type="range" min="0" max="100" value="80" step="1" id="vol" oninput="setVol(this.value)">
      <span class="vol-val" id="vol-val">80%</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">STATUS</div>
      <div class="stat-val dim" id="stat-status">IDLE</div>
    </div>
    <div class="stat">
      <div class="stat-label">PEAK LEVEL</div>
      <div class="stat-val dim" id="stat-peak">---</div>
    </div>
    <div class="stat">
      <div class="stat-label">STREAM UP</div>
      <div class="stat-val dim" id="stat-uptime">--:--:--</div>
    </div>
  </div>

  <div class="status-bar">
    <span class="stream-url" id="stream-url"></span>
    <span id="listeners"></span>
    <span id="clock">--:--:--</span>
  </div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
// Uses whatever host you loaded the page from, so a MagicDNS name, a Tailscale IP, etc. all work.
const HOST = 'http://' + location.hostname + ':8000';
const STREAM_URL = HOST + '/radio';
const STATUS_URL = HOST + '/status-json.xsl';

let state = 'idle';          // idle | connecting | live | reconnecting
let wantPlay = false;
let retryTimer = null, stallTimer = null, retryDelay = 2000;
let audioCtx = null, analyser = null, animFrame = null;
let peakHold = 0;
let streamUp = null;         // null = unknown, true/false after first status poll
let streamStart = null;
let listeners = null;

const audio = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const dot = document.getElementById('dot');
const badge = document.getElementById('status-badge');
const noSignal = document.getElementById('no-signal');
const statStatus = document.getElementById('stat-status');
const statPeak = document.getElementById('stat-peak');
const statUptime = document.getElementById('stat-uptime');

document.getElementById('stream-url').textContent = STREAM_URL;

function setVol(v) {
  audio.volume = v / 100;
  document.getElementById('vol-val').textContent = v + '%';
}

function render() {
  let dotCls = 'status-dot off', badgeTxt = 'OFFLINE', statTxt = 'IDLE', statCls = 'stat-val dim';
  if (state === 'live') {
    dotCls = 'status-dot'; badgeTxt = 'LIVE'; statTxt = 'LIVE'; statCls = 'stat-val green';
  } else if (state === 'connecting') {
    dotCls = 'status-dot connecting'; badgeTxt = 'CONNECTING'; statTxt = 'CONNECTING'; statCls = 'stat-val amber';
  } else if (state === 'reconnecting') {
    dotCls = 'status-dot connecting'; badgeTxt = 'RECONNECTING'; statTxt = 'RETRYING'; statCls = 'stat-val amber';
  } else if (streamUp === true) {
    dotCls = 'status-dot idle'; badgeTxt = 'STREAM UP'; statTxt = 'READY'; statCls = 'stat-val';
  } else if (streamUp === false) {
    badgeTxt = 'STREAM DOWN'; statTxt = 'NO STREAM'; statCls = 'stat-val red';
  }
  dot.className = dotCls;
  badge.textContent = badgeTxt;
  statStatus.textContent = statTxt;
  statStatus.className = statCls;
  playBtn.className = wantPlay ? 'play-btn playing' : 'play-btn';
  playIcon.innerHTML = wantPlay
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5,3 19,12 5,21"/>';
  noSignal.style.display = state === 'live' ? 'none' : 'flex';
}

function togglePlay() {
  if (!wantPlay) startStream(); else stopStream();
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const src = audioCtx.createMediaElementSource(audio);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function loadStream() {
  if (!wantPlay) return;
  audio.src = STREAM_URL + '?t=' + Date.now();
  audio.play().catch(() => {});
}

function scheduleRetry() {
  if (!wantPlay) return;
  clearTimeout(stallTimer);
  clearTimeout(retryTimer);
  state = 'reconnecting';
  render();
  retryTimer = setTimeout(loadStream, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 30000);
}

function startStream() {
  wantPlay = true;
  retryDelay = 2000;
  state = 'connecting';
  render();
  initAudio();
  audio.volume = document.getElementById('vol').value / 100;
  loadStream();
  startViz();
}

function stopStream() {
  wantPlay = false;
  clearTimeout(retryTimer);
  clearTimeout(stallTimer);
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  state = 'idle';
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = null;
  peakHold = 0;
  statPeak.textContent = '---';
  statPeak.className = 'stat-val dim';
  const canvas = document.getElementById('viz');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  render();
}

// Registered once, so a rebuffer can never stack up extra loops or timers.
audio.addEventListener('playing', () => {
  clearTimeout(stallTimer);
  retryDelay = 2000;
  state = 'live';
  render();
});
audio.addEventListener('waiting', () => {
  if (!wantPlay) return;
  clearTimeout(stallTimer);
  stallTimer = setTimeout(scheduleRetry, 15000);
});
audio.addEventListener('error', () => { if (wantPlay) scheduleRetry(); });
audio.addEventListener('ended', () => { if (wantPlay) scheduleRetry(); });

function startViz() {
  if (animFrame) return;
  const canvas = document.getElementById('viz');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  const ctx = canvas.getContext('2d');
  const freq = new Uint8Array(analyser.frequencyBinCount);
  const wave = new Uint8Array(analyser.fftSize);

  function frame() {
    animFrame = requestAnimationFrame(frame);

    analyser.getByteFrequencyData(freq);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const barW = Math.floor(canvas.width / freq.length * 2.5);
    const gap = 2;
    const count = Math.floor(canvas.width / (barW + gap));
    for (let i = 0; i < count; i++) {
      const v = freq[i] / 255;
      const h = Math.max(2, v * canvas.height);
      const x = i * (barW + gap);
      const green = Math.floor(80 + v * 120);
      ctx.fillStyle = v > 0.85 ? '#f85149' : v > 0.6 ? '#d29922' : 'rgb(30,' + green + ',60)';
      ctx.fillRect(x, canvas.height - h, barW, h);
    }

    // True signal peak from the waveform, with a slow decay so it is readable.
    analyser.getByteTimeDomainData(wave);
    let p = 0;
    for (let i = 0; i < wave.length; i++) {
      const a = Math.abs(wave[i] - 128) / 128;
      if (a > p) p = a;
    }
    peakHold = Math.max(p, peakHold * 0.92);
    if (peakHold > 0.008) {
      const db = Math.round(20 * Math.log10(peakHold));
      statPeak.textContent = db + ' dB';
      statPeak.className = 'stat-val ' + (db > -6 ? 'red' : db > -18 ? 'amber' : 'green');
    } else {
      statPeak.textContent = '---';
      statPeak.className = 'stat-val dim';
    }
  }
  frame();
}

async function pollStatus() {
  try {
    const r = await fetch(STATUS_URL, { cache: 'no-store' });
    const j = await r.json();
    let src = j.icestats && j.icestats.source;
    if (Array.isArray(src)) {
      src = src.find(s => /\/radio$/.test(s.listenurl || '')) || src[0];
    }
    if (src) {
      streamUp = true;
      streamStart = Date.parse(src.stream_start_iso8601 || '') || null;
      listeners = src.listeners;
      const kbps = src.bitrate || (src.audio_bitrate ? Math.round(src.audio_bitrate / 1000) : null);
      document.getElementById('bitrate-badge').textContent = (kbps ? kbps : '---') + ' kbps';
    } else {
      streamUp = false;
      streamStart = null;
      listeners = null;
    }
  } catch (e) {
    streamUp = false;
    streamStart = null;
    listeners = null;
  }
  document.getElementById('listeners').textContent =
    listeners === null ? '' : listeners + (listeners === 1 ? ' listener' : ' listeners');
  render();
}

function pad(n) { return String(n).padStart(2, '0'); }

function tick() {
  const n = new Date();
  document.getElementById('clock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  if (streamStart) {
    const s = Math.max(0, Math.floor((Date.now() - streamStart) / 1000));
    statUptime.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
    statUptime.className = 'stat-val';
  } else {
    statUptime.textContent = '--:--:--';
    statUptime.className = 'stat-val dim';
  }
}

render();
setInterval(tick, 1000);
pollStatus();
setInterval(pollStatus, 10000);
</script>
</body>
</html>
