# Find your card name with: arecord -l
# Use the name after "card N:", for example card 1: Device [...] gives hw:CARD=Device,DEV=0
# The name stays the same across reboots. The number (hw:1,0) can change.
[general]
duration        = 0
bufferSecs      = 5
reconnect       = yes
# Needed when running as a non-root user
realtime        = no

[input]
device          = hw:CARD=Device,DEV=0
sampleRate      = 44100
bitsPerSample   = 16
channel         = 2

[icecast2-0]
bitrateMode     = cbr
format          = mp3
bitrate         = 128
server          = 127.0.0.1
port            = 8000
password        = CHANGE_ME
mountPoint      = radio
name            = Radio Feed
description     = Pi radio stream
